<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8607a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Salle">
<title>Ma Salle</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf6f4;--card:#ffffff;--ink:#2b2225;--muted:#8a7b80;--line:#efe4e1;
  --accent:#e8607a;--accent-soft:#fde8ec;--ok:#3fa57a;--ok-soft:#e3f4ec;--shadow:0 2px 10px rgba(80,30,40,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191416;--card:#241d20;--ink:#f4ecee;--muted:#a8979c;--line:#362b2f;
    --accent:#f07a91;--accent-soft:#3a2229;--ok:#58c495;--ok-soft:#1f3329;--shadow:none;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:140px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{padding:22px 0 10px}
header h1{font-size:28px;font-weight:700;letter-spacing:-.5px}
header h1 span{color:var(--accent)}
header p{color:var(--muted);font-size:14px;margin-top:2px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:560px;width:100%}
nav button{flex:1;background:none;border:0;padding:12px 4px 10px;font:inherit;font-size:12px;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--accent);font-weight:600}
.seg{display:flex;background:var(--line);border-radius:12px;padding:4px;gap:4px;margin:8px 0 14px}
.seg button{flex:1;border:0;border-radius:9px;padding:10px;font:inherit;font-weight:600;background:none;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.hint{font-size:13px;color:var(--muted);margin-bottom:10px}
.hint b{color:var(--accent)}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.progress div{height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card h3{font-size:17px;font-weight:600}
.row-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.target{font-size:13px;color:var(--muted);margin-top:2px}
.last{font-size:12px;color:var(--accent);background:var(--accent-soft);display:inline-block;padding:3px 8px;border-radius:6px;margin-top:8px}
.info{border:1px solid var(--line);background:none;color:var(--muted);width:30px;height:30px;border-radius:50%;font:inherit;font-weight:700;cursor:pointer;flex-shrink:0}
.tip{display:none;font-size:14px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.45}
.tip.show{display:block}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.set{display:grid;grid-template-columns:62px 1fr 1fr 44px;gap:8px;align-items:center}
.set.nokg{grid-template-columns:62px 1fr 44px}
.set label{font-size:13px;color:var(--muted)}
.set input{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;text-align:center}
.set input:focus{outline:2px solid var(--accent);border-color:transparent}
.chk{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:transparent}
.chk svg{width:22px;height:22px}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{background:var(--ok-soft)}
.simple{display:flex;align-items:center;gap:12px}
.simple .txt{flex:1}
.simple .txt p{font-size:13px;color:var(--muted);margin-top:2px}
.simple.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:6px}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow)}
.stat b{font-size:28px;display:block}
.stat span{font-size:13px;color:var(--muted)}
.hist h3{display:flex;justify-content:space-between;align-items:center}
.hist h3 small{font-size:13px;color:var(--muted);font-weight:400}
.hist ul{list-style:none;margin-top:8px}
.hist li{font-size:14px;padding:5px 0;border-top:1px solid var(--line);color:var(--muted)}
.hist li b{color:var(--ink);font-weight:500}
.del{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;cursor:pointer;margin-top:8px;text-decoration:underline}
.empty{text-align:center;color:var(--muted);padding:30px 10px;font-size:15px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .full{grid-column:1/-1}
.form label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.form input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
th,td{text-align:left;padding:8px 4px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:500;font-size:12px}
.diff{font-size:12px;color:var(--ok)}
.diff.up{color:var(--muted)}
.tips h3{margin-bottom:8px}
.tips p,.tips li{font-size:15px;line-height:1.5;color:var(--ink)}
.tips ul{padding-left:18px;margin-top:4px}
.tips li{margin-bottom:4px}
#timer{position:fixed;left:0;right:0;bottom:70px;z-index:30;display:none;justify-content:center;padding:0 16px}
#timer.show{display:flex}
#timer .box{max-width:528px;width:100%;background:var(--ink);color:var(--bg);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
#timer .t{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;flex:1}
#timer .t small{display:block;font-size:12px;font-weight:400;opacity:.7}
#timer button{background:rgba(255,255,255,.15);color:inherit;border:0;border-radius:10px;padding:9px 11px;font:inherit;font-weight:600;cursor:pointer}
#timer.end .box{background:var(--ok);color:#fff}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;transition:transform .3s;z-index:40}
#toast.show{transform:translateX(-50%) translateY(0)}
.view{display:none}.view.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Ma <span>Salle</span></h1>
    <p id="sub">3 séances par semaine, on garde le rythme</p>
  </header>

  <section class="view on" id="v-seance"></section>
  <section class="view" id="v-histo"></section>
  <section class="view" id="v-suivi"></section>
  <section class="view" id="v-conseils"></section>
</div>

<div id="timer"><div class="box">
  <div class="t"><small>Repos</small><span id="tval">1:30</span></div>
  <button data-t="-15">-15</button><button data-t="15">+15</button><button data-t="stop">OK</button>
</div></div>
<div id="toast"></div>

<nav><div class="in">
  <button class="on" data-v="seance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Séance</button>
  <button data-v="histo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Historique</button>
  <button data-v="suivi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19l5-6 4 3 7-9"/></svg>Suivi</button>
  <button data-v="conseils"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>Conseils</button>
</div></nav>

<script>
const PROGRAMS = {
  A: {
    name: "Séance A",
    warmup: "5 min de vélo ou tapis, puis 10 squats, 10 ponts fessiers et 10 rotations de bras",
    cardio: "Tapis en pente 8 à 12 %, marche rapide, 15 à 20 min",
    exercises: [
      {id:"goblet", name:"Goblet squat", sets:3, reps:"12", tip:"Tiens un haltère contre la poitrine. Descends les fesses en arrière, dos droit, genoux dans l'axe des pieds. Remonte en poussant dans les talons."},
      {id:"hipthrust", name:"Hip thrust", sets:3, reps:"12", tip:"Haut du dos appuyé sur un banc, barre ou haltère sur les hanches. Pousse avec les talons et serre les fessiers une seconde en haut."},
      {id:"latpull", name:"Tirage vertical poulie", sets:3, reps:"12", tip:"Tire la barre vers le haut de la poitrine. Les coudes descendent vers le bas. Ne te balance pas en arrière."},
      {id:"legpress", name:"Presse à cuisses", sets:3, reps:"12", tip:"Pieds largeur de hanches au milieu de la plateforme. Descends sans décoller le bas du dos. Ne verrouille pas les genoux en haut."},
      {id:"rowmach", name:"Rowing assis machine", sets:3, reps:"12", tip:"Poitrine contre le support. Ramène les coudes en arrière et serre les omoplates."},
      {id:"shoulder", name:"Développé épaules haltères", sets:3, reps:"10", tip:"Assise, dos collé au dossier. Pousse les haltères au-dessus de la tête sans cambrer le dos."},
      {id:"plank", name:"Planche", sets:3, reps:"30 s", noKg:true, tip:"Sur les avant-bras, corps bien aligné. Rentre le ventre et serre les fessiers. Les fesses ne montent pas et ne tombent pas."}
    ]
  },
  B: {
    name: "Séance B",
    warmup: "5 min de vélo ou elliptique, puis 10 fentes au poids du corps, 10 ponts fessiers et 10 rotations de bras",
    cardio: "Elliptique ou vélo à rythme modéré, 20 min",
    exercises: [
      {id:"lunge", name:"Fentes arrière haltères", sets:3, reps:"10 / jambe", tip:"Recule une jambe et descends le genou arrière vers le sol. Le buste reste droit. Pousse sur le talon de devant pour remonter."},
      {id:"rdl", name:"Soulevé de terre jambes tendues", sets:3, reps:"12", tip:"Haltères en main, genoux légèrement fléchis. Pousse les fesses en arrière en gardant le dos droit. Tu dois sentir l'arrière des cuisses s'étirer."},
      {id:"abduct", name:"Abduction machine", sets:3, reps:"15", tip:"Écarte les jambes de façon contrôlée et reviens lentement. Penche un peu le buste en avant pour mieux cibler les fessiers."},
      {id:"pushup", name:"Pompes sur les genoux", sets:3, reps:"max", noKg:true, tip:"Mains un peu plus larges que les épaules. Corps aligné des genoux à la tête. Descends la poitrine près du sol."},
      {id:"rowcable", name:"Tirage horizontal poulie", sets:3, reps:"12", tip:"Dos droit, poitrine sortie. Tire la poignée vers le nombril et serre les omoplates."},
      {id:"crunch", name:"Crunch", sets:3, reps:"15", noKg:true, tip:"Allongée, pieds au sol. Décolle les épaules en contractant les abdos. Ne tire pas sur la nuque avec les mains."}
    ]
  }
};

const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};

let history = LS.get("ms_history", []);
let mesures = LS.get("ms_mesures", []);
let current = LS.get("ms_current", null);

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L19 7"/></svg>';

function suggested(){
  if(!history.length) return "A";
  return history[history.length-1].session === "A" ? "B" : "A";
}
function newCurrent(s){
  const data = {};
  PROGRAMS[s].exercises.forEach(e => { data[e.id] = Array.from({length:e.sets}, () => ({kg:"", reps:"", done:false})); });
  return {session:s, data, warmup:false, cardio:false};
}
if(!current || !PROGRAMS[current.session]) current = newCurrent(suggested());
function saveCurrent(){ LS.set("ms_current", current); }

function lastFor(id){
  for(let i = history.length-1; i >= 0; i--){
    const sets = history[i].exercises && history[i].exercises[id];
    if(sets && sets.length){
      return sets.map(s => (s.kg ? s.kg + " kg × " : "") + (s.reps || "?")).join(", ");
    }
  }
  return "";
}
function hasProgress(){
  if(current.warmup || current.cardio) return true;
  return Object.values(current.data).some(arr => arr.some(s => s.done || s.kg || s.reps));
}
function progressPct(){
  let t = 0, d = 0;
  Object.values(current.data).forEach(arr => arr.forEach(s => { t++; if(s.done) d++; }));
  return t ? Math.round(d / t * 100) : 0;
}

/* ---------- Séance ---------- */
function renderSeance(){
  const p = PROGRAMS[current.session];
  const sug = suggested();
  let h = `<div class="seg">
    <button data-s="A" class="${current.session==="A"?"on":""}">Séance A</button>
    <button data-s="B" class="${current.session==="B"?"on":""}">Séance B</button>
  </div>
  <p class="hint">Séance conseillée aujourd'hui : <b>${PROGRAMS[sug].name}</b>. Repos de 1 min 30 entre les séries.</p>
  <div class="progress"><div id="prog" style="width:${progressPct()}%"></div></div>
  <div class="card simple ${current.warmup?"done":""}" data-simple="warmup">
    <div class="txt"><h3>Échauffement</h3><p>${esc(p.warmup)}</p></div>
    <button class="chk" aria-label="Fait">${CHECK}</button>
  </div>`;

  p.exercises.forEach(e => {
    const last = lastFor(e.id);
    h += `<div class="card" data-ex="${e.id}">
      <div class="row-top">
        <div><h3>${esc(e.name)}</h3><div class="target">${e.sets} séries × ${esc(e.reps)}</div></div>
        <button class="info" data-tip="${e.id}">?</button>
      </div>
      <div class="tip" id="tip-${e.id}">${esc(e.tip)}</div>
      ${last ? `<div class="last">Dernière fois : ${esc(last)}</div>` : ""}
      <div class="sets">`;
    current.data[e.id].forEach((s, i) => {
      h += `<div class="set ${e.noKg?"nokg":""} ${s.done?"done":""}" data-i="${i}">
        <label>Série ${i+1}</label>
        ${e.noKg ? "" : `<input type="text" inputmode="decimal" placeholder="kg" data-f="kg" value="${esc(s.kg)}">`}
        <input type="text" inputmode="decimal" placeholder="${esc(e.reps.replace(" / jambe",""))}" data-f="reps" value="${esc(s.reps)}">
        <button class="chk" aria-label="Série faite">${CHECK}</button>
      </div>`;
    });
    h += `</div></div>`;
  });

  h += `<div class="card simple ${current.cardio?"done":""}" data-simple="cardio">
    <div class="txt"><h3>Cardio</h3><p>${esc(p.cardio)}</p></div>
    <button class="chk" aria-label="Fait">${CHECK}</button>
  </div>
  <button class="btn" id="finish">Terminer la séance</button>`;
  $("#v-seance").innerHTML = h;
}

$("#v-seance").addEventListener("click", ev => {
  const seg = ev.target.closest("[data-s]");
  if(seg){
    const s = seg.dataset.s;
    if(s === current.session) return;
    if(hasProgress() && !confirm("Changer de séance va effacer ce que tu as noté. On continue ?")) return;
    current = newCurrent(s); saveCurrent(); renderSeance(); return;
  }
  const tip = ev.target.closest("[data-tip]");
  if(tip){ $("#tip-" + tip.dataset.tip).classList.toggle("show"); return; }

  const chk = ev.target.closest(".chk");
  if(chk){
    const simple = chk.closest("[data-simple]");
    if(simple){
      const k = simple.dataset.simple;
      current[k] = !current[k];
      simple.classList.toggle("done", current[k]);
      saveCurrent(); return;
    }
    const row = chk.closest(".set");
    const ex = chk.closest("[data-ex]").dataset.ex;
    const s = current.data[ex][+row.dataset.i];
    s.done = !s.done;
    row.classList.toggle("done", s.done);
    $("#prog").style.width = progressPct() + "%";
    saveCurrent();
    if(s.done) startTimer(90);
    return;
  }
  if(ev.target.id === "finish") finish();
});

$("#v-seance").addEventListener("input", ev => {
  const f = ev.target.dataset.f;
  if(!f) return;
  const row = ev.target.closest(".set");
  const ex = ev.target.closest("[data-ex]").dataset.ex;
  current.data[ex][+row.dataset.i][f] = ev.target.value.trim();
  saveCurrent();
});

function finish(){
  const exercises = {};
  let count = 0;
  Object.entries(current.data).forEach(([id, arr]) => {
    const done = arr.filter(s => s.done).map(s => ({kg:s.kg, reps:s.reps}));
    if(done.length){ exercises[id] = done; count += done.length; }
  });
  if(!count){ toast("Coche au moins une série avant de terminer"); return; }
  history.push({date:new Date().toISOString(), session:current.session, exercises, cardio:current.cardio});
  LS.set("ms_history", history);
  current = newCurrent(suggested()); saveCurrent();
  stopTimer();
  renderSeance(); renderHisto();
  window.scrollTo({top:0, behavior:"smooth"});
  toast("Séance enregistrée, bravo !");
}

/* ---------- Minuteur ---------- */
let tEnd = 0, tInt = null;
function startTimer(sec){
  tEnd = Date.now() + sec * 1000;
  $("#timer").classList.add("show"); $("#timer").classList.remove("end");
  clearInterval(tInt); tick(); tInt = setInterval(tick, 250);
}
function tick(){
  const left = Math.max(0, Math.round((tEnd - Date.now()) / 1000));
  $("#tval").textContent = Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0");
  if(left <= 0){
    clearInterval(tInt);
    $("#timer").classList.add("end");
    $("#tval").textContent = "C'est reparti";
    try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
    beep();
  }
}
function stopTimer(){ clearInterval(tInt); $("#timer").classList.remove("show","end"); }
function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination); o.frequency.value = 880;
    g.gain.setValueAtTime(.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + .6);
    o.start(); o.stop(ctx.currentTime + .6);
  }catch(e){}
}
$("#timer").addEventListener("click", ev => {
  const b = ev.target.closest("button"); if(!b) return;
  const t = b.dataset.t;
  if(t === "stop"){ stopTimer(); return; }
  const left = Math.max(0, tEnd - Date.now()) + (+t) * 1000;
  startTimer(Math.max(0, left / 1000));
});

/* ---------- Historique ---------- */
function weekStart(){
  const d = new Date(), day = (d.getDay() + 6) % 7;
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
}
function fmtDate(iso){
  return new Date(iso).toLocaleDateString("fr-FR", {weekday:"long", day:"numeric", month:"long"});
}
function exName(id){
  for(const p of Object.values(PROGRAMS)){ const e = p.exercises.find(x => x.id === id); if(e) return e.name; }
  return id;
}
function renderHisto(){
  const ws = weekStart();
  const week = history.filter(h => new Date(h.date) >= ws).length;
  let h = `<div class="stats">
    <div class="stat"><b>${week}<span style="font-size:16px"> / 3</span></b><span>séances cette semaine</span></div>
    <div class="stat"><b>${history.length}</b><span>séances au total</span></div>
  </div>`;
  if(!history.length){
    h += `<div class="empty">Aucune séance pour l'instant.<br>La première est la plus dure, après ça roule.</div>`;
  }
  history.map((x, i) => [x, i]).reverse().forEach(([x, i]) => {
    h += `<div class="card hist"><h3>${esc(PROGRAMS[x.session] ? PROGRAMS[x.session].name : x.session)}<small>${esc(fmtDate(x.date))}</small></h3><ul>`;
    Object.entries(x.exercises).forEach(([id, sets]) => {
      h += `<li><b>${esc(exName(id))}</b> : ${esc(sets.map(s => (s.kg ? s.kg + " kg × " : "") + (s.reps || "?")).join(", "))}</li>`;
    });
    if(x.cardio) h += `<li><b>Cardio</b> : fait</li>`;
    h += `</ul><button class="del" data-del="${i}">Supprimer</button></div>`;
  });
  $("#v-histo").innerHTML = h;
}
$("#v-histo").addEventListener("click", ev => {
  const b = ev.target.closest("[data-del]"); if(!b) return;
  if(!confirm("Supprimer cette séance ?")) return;
  history.splice(+b.dataset.del, 1);
  LS.set("ms_history", history); renderHisto(); renderSeance();
});

/* ---------- Suivi ---------- */
function todayStr(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function diffCell(v, first){
  if(v === "" || first === "" || v == null || first == null) return "";
  const d = Math.round((parseFloat(v) - parseFloat(first)) * 10) / 10;
  if(isNaN(d) || d === 0) return "";
  return ` <span class="diff ${d > 0 ? "up" : ""}">${d > 0 ? "+" : ""}${d}</span>`;
}
function renderSuivi(){
  let h = `<div class="card">
    <h3 style="margin-bottom:4px">Nouvelle mesure</h3>
    <p class="hint">Une mesure par mois suffit. Toujours le matin, au même endroit.</p>
    <div class="form">
      <div class="full"><label>Date</label><input type="date" id="m-date" value="${todayStr()}"></div>
      <div><label>Tour de cuisse (cm)</label><input type="text" inputmode="decimal" id="m-cuisse"></div>
      <div><label>Tour de taille (cm)</label><input type="text" inputmode="decimal" id="m-taille"></div>
      <div><label>Tour de hanches (cm)</label><input type="text" inputmode="decimal" id="m-hanches"></div>
      <div><label>Poids (kg, facultatif)</label><input type="text" inputmode="decimal" id="m-poids"></div>
    </div>
    <button class="btn" id="m-add" style="margin-top:12px">Ajouter</button>
  </div>`;
  if(mesures.length){
    const f = mesures[0];
    h += `<div class="card"><h3>Évolution</h3><table><tr><th>Date</th><th>Cuisse</th><th>Taille</th><th>Hanches</th><th>Poids</th><th></th></tr>`;
    mesures.forEach((m, i) => {
      h += `<tr><td>${esc(new Date(m.date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}))}</td>
        <td>${esc(m.cuisse || "-")}${i ? diffCell(m.cuisse, f.cuisse) : ""}</td>
        <td>${esc(m.taille || "-")}${i ? diffCell(m.taille, f.taille) : ""}</td>
        <td>${esc(m.hanches || "-")}${i ? diffCell(m.hanches, f.hanches) : ""}</td>
        <td>${esc(m.poids || "-")}</td>
        <td><button class="del" data-mdel="${i}" style="margin:0">×</button></td></tr>`;
    });
    h += `</table><p class="hint" style="margin-top:10px">Les écarts sont calculés par rapport à la première mesure.</p></div>`;
  }
  h += `<div class="card"><h3 style="margin-bottom:4px">Mes données</h3>
    <p class="hint">Tout est stocké sur ce téléphone. Fais une sauvegarde de temps en temps.</p>
    <button class="btn ghost small" id="exp">Exporter</button>
    <button class="btn ghost small" id="imp">Importer</button>
    <input type="file" id="impf" accept="application/json" style="display:none">
  </div>`;
  $("#v-suivi").innerHTML = h;
}
$("#v-suivi").addEventListener("click", ev => {
  if(ev.target.id === "m-add"){
    const m = {
      date: $("#m-date").value || todayStr(),
      cuisse: $("#m-cuisse").value.trim().replace(",", "."),
      taille: $("#m-taille").value.trim().replace(",", "."),
      hanches: $("#m-hanches").value.trim().replace(",", "."),
      poids: $("#m-poids").value.trim().replace(",", ".")
    };
    if(!m.cuisse && !m.taille && !m.hanches && !m.poids){ toast("Remplis au moins une mesure"); return; }
    mesures.push(m); mesures.sort((a, b) => a.date.localeCompare(b.date));
    LS.set("ms_mesures", mesures); renderSuivi(); toast("Mesure ajoutée");
    return;
  }
  const md = ev.target.closest("[data-mdel]");
  if(md){
    if(!confirm("Supprimer cette mesure ?")) return;
    mesures.splice(+md.dataset.mdel, 1); LS.set("ms_mesures", mesures); renderSuivi(); return;
  }
  if(ev.target.id === "exp"){
    const blob = new Blob([JSON.stringify({history, mesures}, null, 2)], {type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "ma-salle-" + todayStr() + ".json"; a.click();
    return;
  }
  if(ev.target.id === "imp") $("#impf").click();
});
$("#v-suivi").addEventListener("change", ev => {
  if(ev.target.id !== "impf" || !ev.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!Array.isArray(d.history) || !Array.isArray(d.mesures)) throw 0;
      if(!confirm("Remplacer les données actuelles par celles du fichier ?")) return;
      history = d.history; mesures = d.mesures;
      LS.set("ms_history", history); LS.set("ms_mesures", mesures);
      renderAll(); toast("Données importées");
    }catch(e){ toast("Fichier invalide"); }
  };
  r.readAsText(ev.target.files[0]);
});

/* ---------- Conseils ---------- */
function renderConseils(){
  $("#v-conseils").innerHTML = `
  <div class="card tips"><h3>Les cuisses</h3>
    <p>On ne peut pas perdre du gras sur une seule zone. Le corps perd du gras partout en même temps, et les cuisses sont souvent la dernière zone à bouger. La muscu sur tout le corps, le cardio et la marche, c'est ce qui fait la différence sur plusieurs mois.</p></div>
  <div class="card tips"><h3>Peur de devenir massive</h3>
    <p>Aucun risque. Les squats et la presse ne vont pas faire gonfler les jambes. Le muscle raffermit et affine la silhouette, surtout quand le gras diminue.</p></div>
  <div class="card tips"><h3>Les charges</h3>
    <ul>
      <li>La première séance, prends léger et apprends les mouvements.</li>
      <li>La bonne charge, c'est quand il te reste 2 ou 3 répétitions possibles à la fin de la série.</li>
      <li>Quand c'est facile, monte un peu le poids ou fais une répétition de plus.</li>
    </ul></div>
  <div class="card tips"><h3>En dehors de la salle</h3>
    <ul>
      <li>7 000 à 10 000 pas par jour.</li>
      <li>Des protéines à chaque repas : viande, poisson, œufs, yaourt grec, légumineuses.</li>
      <li>Beaucoup de légumes, moins de grignotage sucré et de boissons sucrées.</li>
      <li>Bien dormir.</li>
    </ul></div>
  <div class="card tips"><h3>La balance</h3>
    <p>Au début, le poids bouge peu alors que la silhouette change. Les mensurations et les photos sont de meilleurs indicateurs. Une mesure par mois suffit.</p></div>
  <div class="card tips"><h3>Technique</h3>
    <p>Appuie sur le « ? » de chaque exercice pour voir comment le faire. Si un coach est dispo à la salle, demande-lui de vérifier ton squat et ton hip thrust.</p></div>`;
}

/* ---------- Navigation ---------- */
document.querySelector("nav").addEventListener("click", ev => {
  const b = ev.target.closest("[data-v]"); if(!b) return;
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll(".view").forEach(v => v.classList.toggle("on", v.id === "v-" + b.dataset.v));
  window.scrollTo(0, 0);
});

let tT;
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(tT); tT = setTimeout(() => t.classList.remove("show"), 2200);
}
function renderAll(){ renderSeance(); renderHisto(); renderSuivi(); renderConseils(); }
renderAll();
</script>
</body>
</html>
